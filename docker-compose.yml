version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mmtpl_postgres
    restart: always
    environment:
      POSTGRES_USER: mmtpl_user
      POSTGRES_PASSWORD: mmtpl_secure_password_2026
      POSTGRES_DB: mmtpl_store_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: mmtpl_erp_portal
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://mmtpl_user:mmtpl_secure_password_2026@db:5432/mmtpl_store_db
      - SECRET_KEY=mmtpl-production-secret-key-store-2026
    ports:
      - "8000:8000"

volumes:
  postgres_data:
